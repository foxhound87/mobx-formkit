name: Deploy docs

on:
  push:
    branches:
      - docs
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site and deploy it to GitHub Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the docs branch
        uses: actions/checkout@v4
        with:
          ref: docs
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run docs:build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # switches the Pages source to "GitHub Actions" if it is not yet
          enablement: true

      - name: Upload the site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _book

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
